name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: pnpm sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Mirrors this repo's documented local dev setup (trust-authenticated
          # Postgres on 127.0.0.1) rather than plumbing a password through every
          # integration suite's pg.Pool config — see README's "Try it today".
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_SUPERUSER: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm --filter @aiappfactory/spec-compiler test:integration
      - run: pnpm --filter @aiappfactory/sdk-gateway test:integration
      # auth-bff's and runtime's integration suites manage their own throwaway
      # Keycloak container via the Docker CLI directly (see their test files) rather
      # than a `services:` entry here — GitHub-hosted ubuntu-latest runners have
      # Docker available by default, no extra setup needed.
      - run: pnpm --filter @aiappfactory/auth-bff test:integration
      - run: pnpm --filter @aiappfactory/runtime test:integration
      - run: pnpm --filter @aiappfactory/setup-guard test:integration
